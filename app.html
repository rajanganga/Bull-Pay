<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#090D18" />
  <title>BullPay — Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs"></div>
  <div class="grid-bg"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="loading-screen"><div class="spinner"></div></div>

  <!-- Login Screen -->
  <div id="loginScreen" class="auth-screen hidden fade-in">
    <div class="auth-card glass">
      <div class="brand center-text" style="justify-content:center; margin-bottom:20px;">
        <span class="brand-icon">⚡</span>
        <span>Bull<span class="brand-accent">Pay</span></span>
      </div>
      <h1>Welcome <span class="text-neon">back</span></h1>
      <p class="sub">Login to your wallet</p>
      <form id="loginForm">
        <label class="field"><span>User ID</span><input class="input" name="u" placeholder="your username" required /></label>
        <label class="field"><span>Password</span><input class="input" name="p" type="password" placeholder="••••••••" required /></label>
        <button type="submit" class="btn btn-primary btn-lg btn-block mt-2">Login →</button>
      </form>
      <p class="center-text text-sm text-dim mt-4"><a href="/admin" style="color:var(--neon); text-decoration:none;">Admin panel →</a></p>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden fade-in">
    <header class="app-header">
      <div class="container">
        <div class="brand"><span class="brand-icon">⚡</span><span>Bull<span class="brand-accent">Pay</span></span></div>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </header>

    <main class="container" style="padding-top:20px; padding-bottom:60px;">
      <!-- Balance Card with Graph -->
      <div class="card balance-card">
        <div class="balance-label">Wallet Overview <span class="live-dot"></span></div>
        <div class="balance-amount"><span class="cur">$</span><span id="totalDeposits">0</span></div>
        <div class="balance-meta">
          <div><small>Orders</small><p id="orderCount">0</p></div>
          <div><small>Approved</small><p id="approvedCount" style="color:var(--neon);">0</p></div>
          <div><small>Pending</small><p id="pendingCount" style="color:var(--warn);">0</p></div>
        </div>
        <!-- Graph Canvas -->
        <canvas id="walletChart" width="400" height="100" style="width:100%; height:120px; margin-top:15px; border-radius:8px;"></canvas>
      </div>

      <!-- Tabs -->
      <div class="tabs" style="margin-top:20px;">
        <button class="tab active" data-tab="deposit">💳 Deposit</button>
        <button class="tab" data-tab="banks">🏦 Banks</button>
        <button class="tab" data-tab="orders">📋 Orders</button>
      </div>

      <!-- TAB: DEPOSIT -->
      <section id="tab-deposit" class="tab-content">
        <div class="card">
          <div class="card-title">Step 1 — Choose Amount</div>
          <div class="slot-grid" id="slotGrid"></div>
        </div>
        <div class="card mt-4">
          <div class="card-title">Step 2 — Send Payment To</div>
          <div id="payAddressBox" class="list-item">
            <div class="info"><strong id="payNetwork">TRC20</strong><small id="payAddress" style="word-break:break-all;">Loading...</small></div>
            <button id="copyAddrBtn" class="btn btn-ghost btn-sm">Copy</button>
          </div>
        </div>
        <div class="card mt-4">
          <div class="card-title">Step 3 — Submit Details</div>
          <form id="orderForm">
            <label class="field"><span>Select Bank Account</span><select class="input" name="bankId" id="bankSelect" required></select></label>
            <label class="field"><span>Transaction ID</span><input class="input" name="txid" placeholder="Enter UPI/Txn ID" required /></label>
            <label class="field">
              <span>Payment Screenshot / Receipt</span>
              <input class="input" type="file" name="receipt" accept="image/*" required style="padding:8px;" />
            </label>
            <button type="submit" class="btn btn-primary btn-lg btn-block mt-2">Submit Order →</button>
          </form>
        </div>
      </section>

      <!-- TAB: BANKS -->
      <section id="tab-banks" class="tab-content hidden">
        <div class="card">
          <div class="card-title"><span>Your Bank Accounts</span><button id="addBankBtn" class="btn btn-primary btn-sm">+ Add</button></div>
          <div id="banksList"><p class="text-dim center-text text-sm" style="padding:20px 0;">No banks added yet</p></div>
        </div>
        <div id="addBankForm" class="card mt-4 hidden">
          <div class="card-title">Add New Bank</div>
          <form id="newBankForm">
            <label class="field"><span>Account Type</span><select class="input" name="type" required><option value="Savings">Savings</option><option value="Current">Current</option></select></label>
            <label class="field"><span>Account Number</span><input class="input" name="number" placeholder="1234567890" required /></label>
            <label class="field"><span>Bank Name</span><input class="input" name="bank" placeholder="SBI, HDFC..." required /></label>
            <label class="field"><span>IFSC Code</span><input class="input" name="ifsc" placeholder="SBIN0001234" required style="text-transform:uppercase;" /></label>
            <div class="row"><button type="submit" class="btn btn-primary">Save Bank</button><button type="button" id="cancelBankBtn" class="btn btn-ghost">Cancel</button></div>
          </form>
        </div>
      </section>

      <!-- TAB: ORDERS -->
      <section id="tab-orders" class="tab-content hidden">
        <div class="card">
          <div class="card-title">Order History</div>
          <div id="ordersList"><p class="text-dim center-text text-sm" style="padding:20px 0;">No orders yet</p></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
