<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BullPay — Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    <div style="background: #0A0E17; border: 1px solid #00FF41; padding: 30px; border-radius: 10px; width: 100%; max-width: 400px;">
      <h2 style="color: #00FF41; text-align: center; margin-bottom: 20px; font-family: 'Orbitron';">BULL PAY</h2>
      <form id="loginForm">
        <input type="text" id="userId" placeholder="User ID" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #333; border-radius: 5px;" />
        <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #333; border-radius: 5px;" />
        <button type="submit" style="width: 100%; padding: 12px; background: #00FF41; color: #000; font-weight: bold; border: none; border-radius: 5px; font-family: 'Orbitron';">LOGIN</button>
      </form>
      <p id="loginError" style="color: #FF003C; text-align: center; margin-top: 10px; font-size: 14px;"></p>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="mainApp" style="display: none; padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="color: #00FF41; font-family: 'Orbitron';">Dashboard</h2>
      <button id="logoutBtn" style="padding: 8px 15px; background: #FF003C; color: #fff; border: none; border-radius: 5px;">Logout</button>
    </div>

    <div style="background: #0A0E17; border: 1px solid #00FF41; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
      <h3 style="color: #00FF41; margin-bottom: 10px;">Wallet Balance</h3>
      <h1 style="color: #fff; font-family: 'Orbitron';">₹<span id="balance">0</span></h1>
    </div>

    <div style="background: #0A0E17; border: 1px solid #00FF41; padding: 20px; border-radius: 10px;">
      <h3 style="color: #00FF41; margin-bottom: 10px;">Add Bank Account</h3>
      <form id="bankForm">
        <input type="text" id="bankName" placeholder="Bank Name (e.g. SBI)" required style="width: 100%; padding: 10px; margin-bottom: 10px; background: #000; color: #fff; border: 1px solid #333;" />
        <input type="text" id="holderName" placeholder="Account Holder Name" required style="width: 100%; padding: 10px; margin-bottom: 10px; background: #000; color: #fff; border: 1px solid #333;" />
        <input type="text" id="accountNumber" placeholder="Account Number" required style="width: 100%; padding: 10px; margin-bottom: 10px; background: #000; color: #fff; border: 1px solid #333;" />
        <input type="text" id="ifscCode" placeholder="IFSC Code" required style="width: 100%; padding: 10px; margin-bottom: 10px; background: #000; color: #fff; border: 1px solid #333;" />
        <button type="submit" style="width: 100%; padding: 12px; background: #00FF41; color: #000; font-weight: bold; border: none; border-radius: 5px;">SAVE BANK</button>
      </form>
      <p id="bankMsg" style="color: #00FF41; text-align: center; margin-top: 10px; font-size: 14px;"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
