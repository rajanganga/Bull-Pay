<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>BullPay</title>
<style>
:root{--g:#f5b301;--bg:#0e0f13;--c:#1b1d24;--t:#f2f2f2}
*{box-sizing:border-box}body{margin:0 auto;max-width:480px;padding:16px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
.logo{text-align:center}.logo h1{margin:4px 0;color:var(--g);letter-spacing:1px}
.card{background:var(--c);border-radius:14px;padding:14px;margin:10px 0}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #333;background:#111;color:var(--t);font-size:15px}
button{background:var(--g);color:#000;border:0;font-weight:700}button.s{background:#333;color:var(--t);width:auto;padding:6px 10px}
.tabs{display:flex;gap:6px}.tabs button{background:#222;color:var(--t)}.tabs button.on{background:var(--g);color:#000}
.slot{display:inline-block;width:31%;margin:1%;padding:12px 0;text-align:center;background:#111;border:1px solid #333;border-radius:10px;cursor:pointer}
.slot.on{border-color:var(--g);color:var(--g);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.m{color:#999;font-size:13px}.err{color:#ff6b6b}
.pending{color:var(--g)}.approved{color:#4cd964}.rejected{color:#ff6b6b}code{word-break:break-all;color:var(--g)}
</style></head><body>
<div class="logo"><svg width="84" height="84" viewBox="0 0 100 100"><path d="M8 20c4 22 14 30 26 32l4-14c-10-2-16-8-30-18z" fill="#f5b301"/><path d="M92 20c-4 22-14 30-26 32l-4-14c10-2 16-8 30-18z" fill="#f5b301"/><path d="M30 40h40l-4 36q-16 14-32 0z" fill="#f5b301"/><circle cx="41" cy="55" r="4" fill="#0e0f13"/><circle cx="59" cy="55" r="4" fill="#0e0f13"/><ellipse cx="50" cy="73" rx="12" ry="7" fill="#0e0f13"/></svg><h1>BullPay</h1></div>
<div id="v"></div>
<script>
let T=localStorage.t||'',M=null,tab='sell',sel=null,msg='';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function api(p,b){const r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json','x-token':T},body:JSON.stringify(b||{})});
 const j=await r.json().catch(()=>({}));if(r.status==401&&p!='login'){T='';localStorage.t='';load();}if(!r.ok)throw new Error(j.e||'Error');return j}
function err(e){msg=e.message;draw()}
async function load(){if(!T){M=null;return draw()}try{M=await api('me');msg='';draw()}catch(e){draw()}}
function draw(){const v=$('#v');
 if(!T||!M){v.innerHTML='<div class="card"><h3>Login</h3><input id="u" placeholder="User ID" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><div class="err">'+esc(msg)+'</div><div class="m">ID/password admin se lein.</div></div>';return}
 let h='<div class="tabs">'+[['sell','Sell USDT'],['bank','Bank'],['ord','Orders']].map(a=>'<button class="'+(tab==a[0]?'on':'')+'" onclick="tab=\''+a[0]+'\';msg=\'\';draw()">'+a[1]+'</button>').join('')+'</div>';
 if(tab=='sell'){h+='<div class="card"><b>Slot chunein</b> <span class="m">(min 500 USDT, har grade +100)</span><div>'+M.slots.map(s=>'<div class="slot '+(sel==s?'on':'')+'" onclick="sel='+s+';draw()">'+s+'</div>').join('')+'</div></div>';
  if(sel){h+='<div class="card"><div>'+sel+' USDT ('+esc(M.settings.network)+') is address par bhejein:</div><p><code>'+(esc(M.settings.address)||'Address abhi set nahi hai')+'</code></p>'+
   (M.banks.length?'<select id="bk">'+M.banks.map(b=>'<option value="'+b.id+'">'+esc(b.bank)+' - '+esc(b.number.slice(-4).padStart(b.number.length,'*'))+'</option>').join('')+'</select>':'<div class="err">Pehle Bank tab me bank add karein</div>')+
   '<input id="tx" placeholder="Transaction ID yahan daalein"><button onclick="submitOrder()">Submit</button></div>'}}
 if(tab=='bank'){h+='<div class="card"><b>Bank add karein</b><select id="bt"><option>Savings</option><option>Current</option></select><input id="bn" placeholder="Account number" inputmode="numeric"><input id="bb" placeholder="Bank name"><input id="bi" placeholder="IFSC code" maxlength="11"><button onclick="addBank()">Add</button></div>'+
  M.banks.map(b=>'<div class="card row"><div>'+esc(b.bank)+' ('+esc(b.type)+')<div class="m">'+esc(b.number)+' | '+esc(b.ifsc)+'</div></div><button class="s" onclick="delBank(\''+b.id+'\')">Delete</button></div>').join('')}
 if(tab=='ord'){h+=M.orders.length?M.orders.map(o=>'<div class="card"><div class="row"><b>'+o.slot+' USDT</b><span class="'+o.status+'">'+o.status+'</span></div><div class="m">'+esc(o.txid)+'<br>'+new Date(o.ts).toLocaleString()+'</div></div>').join(''):'<div class="card m">Abhi koi order nahi.</div>'}
 h+='<div class="err">'+esc(msg)+'</div><button class="s" onclick="T=\'\';localStorage.t=\'\';M=null;draw()">Logout</button>';v.innerHTML=h}
async function login(){try{const j=await api('login',{u:$('#u').value,p:$('#p').value});T=j.t;localStorage.t=T;load()}catch(e){err(e)}}
async function addBank(){try{await api('bank/add',{type:$('#bt').value,number:$('#bn').value,bank:$('#bb').value,ifsc:$('#bi').value});await load()}catch(e){err(e)}}
async function delBank(id){if(confirm('Delete karein?')){await api('bank/del',{id});load()}}
async function submitOrder(){try{await api('order',{slot:sel,bankId:$('#bk')?.value,txid:$('#tx').value});sel=null;tab='ord';await load()}catch(e){err(e)}}
load();
</script></body></html>
