<!-- Replace only the <main> section and <script> -->

<main class="container" style="padding-top:20px; padding-bottom:60px;">
  <div class="tabs">
    <button class="tab active" data-tab="orders">📋 Orders</button>
    <button class="tab" data-tab="users">👥 Users & Cards</button>
    <button class="tab" data-tab="logs">📜 Logs</button>
    <button class="tab" data-tab="settings">⚙️ Settings</button>
  </div>

  <section id="tab-orders" class="tab-content">
    <div class="card">
      <div class="card-title">
        <span>All Orders</span>
        <div class="row">
          <input class="input" id="searchOrders" placeholder="Search Username or TXID..." style="width:200px; padding:6px 10px; font-size:13px;" />
          <select class="input" id="filterStatus" style="width:120px; padding:6px 10px; font-size:13px;">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div id="adminOrders"></div>
    </div>
  </section>

  <!-- (Users tab, Logs tab, Settings tab waisa hi rahega) -->
</main>

<script>
  // ... (A ke object mein koi change nahi) ...
  
  // Make sure to update the renderOrders function inside admin.html
  function renderOrders() {
    const wrap = $('#adminOrders');
    const query = $('#searchOrders').value.toLowerCase();
    const filter = $('#filterStatus').value;

    let filtered = adminState.orders;
    if (filter !== 'all') filtered = filtered.filter(o => o.status === filter);
    if (query) filtered = filtered.filter(o => o.username.toLowerCase().includes(query) || o.txid.toLowerCase().includes(query));

    if (!filtered.length) { wrap.innerHTML = '<p class="text-dim center-text text-sm" style="padding:20px 0;">No orders found</p>'; return; }
    
    wrap.innerHTML = filtered.map(o => `
      <div class="list-item" style="flex-direction:column; align-items:flex-start;">
        <div style="display:flex; justify-content:space-between; width:100%;">
          <div class="info">
            <strong>$${o.slot} — ${esc(o.username || 'unknown')}</strong>
            <small>TXN: ${esc(o.txid)} • ${new Date(o.ts).toLocaleString()}</small>
          </div>
          <div class="row">
            ${o.status === 'pending' ? `
              <button class="btn btn-primary btn-sm" data-approve="${o.id}">Approve</button>
              <button class="btn btn-danger btn-sm" data-reject="${o.id}">Reject</button>
            ` : `<span class="badge badge-${o.status}">${o.status}</span>`}
          </div>
        </div>
        ${o.receipt ? `<div style="margin-top:10px; width:100%;"><small style="color:var(--text-dim);">Receipt:</small><br><img src="${o.receipt}" style="max-height:100px; border-radius:8px; margin-top:5px; border:1px solid var(--border-soft);" /></div>` : ''}
      </div>
    `).join('');

    wrap.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => setStatus(b.dataset.approve, 'approved'));
    wrap.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => setStatus(b.dataset.reject, 'rejected'));
  }

  // Add Event Listeners for search/filter after loadAll
  document.getElementById('searchOrders').addEventListener('input', renderOrders);
  document.getElementById('filterStatus').addEventListener('change', renderOrders);
</script>
