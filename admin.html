<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BullPay — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs"></div>
  <div class="grid-bg"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Login Screen -->
  <div id="adminLogin" class="auth-screen hidden">
    <div class="auth-card glass">
      <div class="brand center-text" style="justify-content:center; margin-bottom:20px;">
        <span class="brand-icon">⚡</span><span>Bull<span class="brand-accent">Pay</span> Admin</span>
      </div>
      <h1>Admin <span class="text-neon">Access</span></h1>
      <form id="adminLoginForm">
        <label class="field"><span>Password</span><input class="input" name="p" type="password" placeholder="••••••••" required /></label>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Login →</button>
      </form>
      <p class="center-text text-sm text-dim mt-4"><a href="/" style="color:var(--neon); text-decoration:none;">← Back to User Site</a></p>
    </div>
  </div>

  <!-- Main Admin App -->
  <div id="adminApp" class="hidden">
    <header class="app-header">
      <div class="container">
        <div class="brand"><span class="brand-icon">⚡</span><span>Bull<span class="brand-accent">Pay</span> Admin</span></div>
        <button id="adminLogout" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </header>

    <main class="container" style="padding-top:20px; padding-bottom:60px;">
      <div class="tabs">
        <button class="tab active" data-tab="orders">📋 Orders</button>
        <button class="tab" data-tab="users">👥 Users & Cards</button>
        <button class="tab" data-tab="logs">📜 Logs</button>
        <button class="tab" data-tab="settings">⚙️ Settings</button>
      </div>

      <!-- TAB: ORDERS -->
      <section id="tab-orders" class="tab-content">
        <div class="card">
          <div class="card-title">
            <span>All Orders</span>
          </div>
          <div class="row" style="margin-bottom:15px;">
            <input class="input" id="searchOrders" placeholder="Search Username or TXID..." style="flex:1; padding:8px 12px; font-size:13px;" />
            <select class="input" id="filterStatus" style="width:130px; padding:8px 12px; font-size:13px;">
              <option value="all">All Status</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div id="adminOrders"></div>
        </div>
      </section>

      <!-- TAB: USERS -->
      <section id="tab-users" class="tab-content hidden">
        <div class="card">
          <div class="card-title"><span>Users</span><button id="addUserBtn" class="btn btn-primary btn-sm">+ Add User</button></div>
          <div id="addUserForm" class="hidden" style="margin-bottom:16px;">
            <form id="newUserForm" class="stack">
              <label class="field"><span>Username</span><input class="input" name="u" required /></label>
              <label class="field"><span>Password</span><input class="input" name="p" type="password" required /></label>
              <div class="row"><button class="btn btn-primary" type="submit">Create</button><button class="btn btn-ghost" type="button" id="cancelUserBtn">Cancel</button></div>
            </form>
          </div>
          <div id="adminUsers"></div>
        </div>
      </section>

      <!-- TAB: LOGS -->
      <section id="tab-logs" class="tab-content hidden">
        <div class="card">
          <div class="card-title">User Activity Logs</div>
          <div id="adminLogs"></div>
        </div>
      </section>

      <!-- TAB: SETTINGS -->
      <section id="tab-settings" class="tab-content hidden">
        <div class="card">
          <div class="card-title">Payment Settings</div>
          <form id="settingsForm" class="stack">
            <label class="field"><span>Wallet Address</span><input class="input" name="address" placeholder="Your crypto/UPI address" required /></label>
            <label class="field"><span>Network</span><input class="input" name="network" placeholder="TRC20" required /></label>
            <button class="btn btn-primary" type="submit">Save Settings</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script>
    // --- API Setup ---
    const A = {
      token: localStorage.getItem('bp_admin') || '',
      async req(path, body) {
        const h = { 'Content-Type': 'application/json' };
        if (this.token) h['x-token'] = this.token;
        const r = await fetch('/api/' + path, { method: 'POST', headers: h, body: body ? JSON.stringify(body) : undefined });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.e || 'Error');
        return d;
      },
    };

    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    function toast(m, t='ok') { 
      const el = document.createElement('div'); 
      el.className = 'toast ' + t; 
      el.textContent = m; 
      $('#toastWrap').appendChild(el); 
      setTimeout(() => el.remove(), 3500); 
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

    let adminState = { users: [], banks: [], orders: [], settings: {}, logs: [] };

    // --- Load Data ---
    async function loadAll() {
      try {
        const d = await A.req('admin/all', {});
        adminState = d;
        renderOrders(); 
        renderUsers(); 
        renderLogs(); 
        fillSettings();
        $('#adminLogin').classList.add('hidden'); 
        $('#adminApp').classList.remove('hidden');
      } catch (e) {
        toast('❌ Load failed: ' + e.message, 'err');
        localStorage.removeItem('bp_admin'); A.token = '';
        showLogin();
      }
    }

    function showLogin() { $('#adminLogin').classList.remove('hidden'); $('#adminApp').classList.add('hidden'); }

    // --- Render Orders ---
    function renderOrders() {
      const wrap = $('#adminOrders');
      const query = ($('#searchOrders')?.value || '').toLowerCase();
      const filter = $('#filterStatus')?.value || 'all';

      let filtered = adminState.orders;
      if (filter !== 'all') filtered = filtered.filter(o => o.status === filter);
      if (query) filtered = filtered.filter(o => (o.username || '').toLowerCase().includes(query) || (o.txid || '').toLowerCase().includes(query));

      if (!filtered.length) { wrap.innerHTML = '<p class="text-dim center-text text-sm" style="padding:20px 0;">No orders found</p>'; return; }
      
      wrap.innerHTML = filtered.map(o => `
        <div class="list-item" style="flex-direction:column; align-items:flex-start;">
          <div style="display:flex; justify-content:space-between; width:100%;">
            <div class="info">
              <strong>$${o.slot} — ${esc(o.username || 'unknown')}</strong>
              <small>TXN: ${esc(o.txid)} • ${new Date(o.ts).toLocaleString()}</small>
            </div>
            <div class="row">
              ${o.status === 'pending' ? `
                <button class="btn btn-primary btn-sm" data-approve="${o.id}">Approve</button>
                <button class="btn btn-danger btn-sm" data-reject="${o.id}">Reject</button>
              ` : `<span class="badge badge-${o.status}">${o.status}</span>`}
            </div>
          </div>
          ${o.receipt ? `<div style="margin-top:10px; width:100%;"><small style="color:var(--text-dim);">Receipt:</small><br><img src="${o.receipt}" style="max-height:100px; border-radius:8px; margin-top:5px; border:1px solid var(--border-soft);" /></div>` : ''}
        </div>
      `).join('');

      wrap.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => setStatus(b.dataset.approve, 'approved'));
      wrap.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => setStatus(b.dataset.reject, 'rejected'));
    }

    async function setStatus(id, status) {
      try { await A.req('admin/order', { id, status }); toast('✅ Order ' + status); await loadAll(); } catch (e) { toast('❌ ' + e.message, 'err'); }
    }

    // --- Render Users ---
    function renderUsers() {
      const wrap = $('#adminUsers');
      if (!adminState.users.length) { wrap.innerHTML = '<p class="text-dim center-text text-sm" style="padding:20px 0;">No users</p>'; return; }
      
      wrap.innerHTML = adminState.users.map(u => {
        const userBanks = adminState.banks.filter(b => b.userId === u.id);
        return `
          <div class="list-item" style="flex-direction:column; align-items:flex-start;">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <div class="info"><strong>${esc(u.username)}</strong><small>ID: ${esc(u.id)}</small></div>
              <div class="row">
                <button class="btn btn-ghost btn-sm" data-toggle="${u.id}">${u.disabled ? 'Enable' : 'Disable'}</button>
                <button class="btn btn-ghost btn-sm" data-pass="${u.id}">Reset Pass</button>
                <button class="btn btn-danger btn-sm" data-del="${u.id}">Delete</button>
              </div>
            </div>
            ${userBanks.length ? `
              <div style="margin-top:10px; background:rgba(255,255,255,0.02); padding:10px; border-radius:8px; width:100%;">
                <small style="color:var(--neon); font-weight:600;">Added Cards/Banks:</small>
                <ul style="margin-top:5px; padding-left:15px; font-size:13px; color:var(--text-dim);">
                  ${userBanks.map(b => `<li>${esc(b.bank)} - A/C: ${esc(b.number)} (${esc(b.type)})</li>`).join('')}
                </ul>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      wrap.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => { try { await A.req('admin/user/toggle', { id: b.dataset.toggle }); toast('✅ Updated'); await loadAll(); } catch (e) { toast('❌ ' + e.message, 'err'); } });
      wrap.querySelectorAll('[data-pass]').forEach(b => b.onclick = async () => { const p = prompt('New password (min 6 chars):'); if (!p) return; try { await A.req('admin/user/pass', { id: b.dataset.pass, p }); toast('✅ Password reset'); } catch (e) { toast('❌ ' + e.message, 'err'); } });
      wrap.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Delete this user?')) return; try { await A.req('admin/user/del', { id: b.dataset.del }); toast('✅ Deleted'); await loadAll(); } catch (e) { toast('❌ ' + e.message, 'err'); } });
    }

    // --- Render Logs ---
    function renderLogs() {
      const wrap = $('#adminLogs');
      if (!adminState.logs || !adminState.logs.length) { wrap.innerHTML = '<p class="text-dim center-text text-sm" style="padding:20px 0;">No activity yet</p>'; return; }
      
      wrap.innerHTML = adminState.logs.map(l => {
        const user = adminState.users.find(u => u.id === l.userId);
        return `
          <div class="list-item">
            <div class="info">
              <strong>${user ? esc(user.username) : 'Unknown'} — ${esc(l.action)}</strong>
              <small>${esc(l.details)} • ${new Date(l.ts).toLocaleString()}</small>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- Settings ---
    function fillSettings() { const f = $('#settingsForm'); f.address.value = adminState.settings.address || ''; f.network.value = adminState.settings.network || 'TRC20'; }
    $('#settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = e.target;
      try { await A.req('admin/settings', { address: f.address.value, network: f.network.value }); toast('✅ Settings saved'); await loadAll(); } catch (err) { toast('❌ ' + err.message, 'err'); }
    });

    // --- Login ---
    $('#adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { t } = await A.req('admin/login', { p: e.target.p.value });
        A.token = t; localStorage.setItem('bp_admin', t); toast('✅ Welcome, Admin'); await loadAll();
      } catch (err) { toast('❌ ' + err.message, 'err'); }
    });

    $('#adminLogout').onclick = () => { localStorage.removeItem('bp_admin'); location.reload(); };
    
    // --- Tabs ---
    $$('.tab').forEach(t => t.onclick = () => { 
      $$('.tab').forEach(x => x.classList.remove('active')); 
      t.classList.add('active'); 
      $$('.tab-content').forEach(x => x.classList.add('hidden')); 
      $('#tab-' + t.dataset.tab).classList.remove('hidden'); 
    });
    
    // --- Add User ---
    $('#addUserBtn').onclick = () => $('#addUserForm').classList.toggle('hidden');
    $('#cancelUserBtn').onclick = () => $('#addUserForm').classList.add('hidden');
    $('#newUserForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = e.target;
      try { await A.req('admin/user/add', { u: f.u.value, p: f.p.value }); toast('✅ User created'); f.reset(); $('#addUserForm').classList.add('hidden'); await loadAll(); } catch (err) { toast('❌ ' + err.message, 'err'); }
    });

    // --- Search & Filter Listeners ---
    document.getElementById('searchOrders').addEventListener('input', renderOrders);
    document.getElementById('filterStatus').addEventListener('change', renderOrders);

    // --- Boot App ---
    (function boot() {
      if (A.token) {
        loadAll().catch(() => { localStorage.removeItem('bp_admin'); A.token = ''; showLogin(); });
      } else {
        showLogin();
      }
    })();
  </script>
</body>
</html>
