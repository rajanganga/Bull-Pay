<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BullPay — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070A; --panel: #0A0E17; --border: #1F2937;
      --neon: #00FF41; --danger: #FF003C; --warn: #F59E0B;
      --text: #E2E8F0; --text-dim: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .hidden { display: none !important; }
    
    /* LOGIN SCREEN */
    #adminLogin { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
    .login-box { background: var(--panel); border: 1px solid var(--neon); padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 0 30px rgba(0,255,65,0.2); text-align: center; }
    .login-box h1 { color: var(--neon); font-family: 'Orbitron'; margin-bottom: 20px; font-size: 24px; }
    .input-field { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; margin-bottom: 15px; font-size: 16px; }
    .btn { width: 100%; padding: 15px; background: var(--neon); color: #000; font-family: 'Orbitron'; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .btn:hover { background: #00cc34; }

    /* MAIN APP */
    #adminApp { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .logo { font-family: 'Orbitron'; color: var(--neon); font-size: 22px; font-weight: bold; }
    .btn-logout { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    /* TABS */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
    .tab { flex: 1; padding: 12px; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; font-size: 13px; white-space: nowrap; }
    .tab.active { background: var(--neon); color: #000; border-color: var(--neon); }

    /* CARDS */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-family: 'Orbitron'; color: var(--neon); font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    
    /* LISTS */
    .list-item { background: #000; border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; border: none; }
    .btn-approve { background: var(--neon); color: #000; }
    .btn-reject { background: var(--danger); color: #fff; }
    .btn-del { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    
    /* BADGES */
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .b-pending { background: rgba(245,158,11,0.2); color: var(--warn); }
    .b-approved { background: rgba(0,255,65,0.2); color: var(--neon); }
    .b-rejected { background: rgba(255,0,60,0.2); color: var(--danger); }
    
    /* FORM */
    .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 200px; }
    .form-group label { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 5px; }
    
    /* TOAST */
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #0A0E17; border: 1px solid var(--neon); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: bold; z-index: 9999; display: none; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- LOGIN -->
  <div id="adminLogin">
    <div class="login-box">
      <h1>BULLPAY ADMIN</h1>
      <input type="password" id="adminPass" class="input-field" placeholder="Enter Admin Password" />
      <button class="btn" onclick="doAdminLogin()">LOGIN</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="adminApp" class="hidden">
    <div class="header">
      <div class="logo">BULLPAY ADMIN</div>
      <button class="btn-logout" onclick="logoutAdmin()">LOGOUT</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" data-tab="orders" onclick="switchAdminTab('orders')">📋 Orders</div>
      <div class="tab" data-tab="users" onclick="switchAdminTab('users')">👥 Users & Banks</div>
      <div class="tab" data-tab="logs" onclick="switchAdminTab('logs')">📜 Logs</div>
      <div class="tab" data-tab="settings" onclick="switchAdminTab('settings')">⚙️ Settings</div>
    </div>

    <!-- ORDERS TAB -->
    <div id="tab-orders" class="tab-content">
      <div class="card">
        <div class="card-title">All Orders</div>
        <div class="form-row" style="margin-bottom: 15px;">
          <input type="text" id="searchOrders" class="input-field" placeholder="Search Username or TXID..." style="margin-bottom: 0;" />
          <select id="filterStatus" class="input-field" style="margin-bottom: 0;">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div id="adminOrdersList"></div>
      </div>
    </div>

    <!-- USERS TAB -->
    <div id="tab-users" class="tab-content hidden">
      <div class="card">
        <div class="card-title">
          <span>Users List</span>
          <button class="btn-sm btn-approve" onclick="document.getElementById('addUserForm').classList.toggle('hidden')">+ ADD USER</button>
        </div>
        <div id="addUserForm" class="hidden" style="background: rgba(0,255,65,0.05); padding: 15px; border: 1px dashed var(--neon); margin-bottom: 20px;">
          <div class="form-row">
            <div class="form-group"><label>Username</label><input type="text" id="newUserId" class="input-field" /></div>
            <div class="form-group"><label>Password</label><input type="password" id="newUserPass" class="input-field" /></div>
            <div class="form-group"><label>Mobile No.</label><input type="text" id="newUserMob" class="input-field" /></div>
          </div>
          <div class="row">
            <button class="btn-sm btn-approve" onclick="createUser()">CREATE USER</button>
            <button class="btn-sm btn-del" onclick="document.getElementById('addUserForm').classList.add('hidden')">CANCEL</button>
          </div>
        </div>
        <div id="adminUsersList"></div>
      </div>
    </div>

    <!-- LOGS TAB -->
    <div id="tab-logs" class="tab-content hidden">
      <div class="card">
        <div class="card-title">User Activity Logs</div>
        <div id="adminLogsList"></div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-content hidden">
      <div class="card">
        <div class="card-title">Rate Configuration</div>
        <div class="form-row">
          <div class="form-group"><label>Base Rate (₹)</label><input type="number" id="setBaseRate" class="input-field" /></div>
          <div class="form-group"><label>Rate Step (₹)</label><input type="number" id="setRateStep" class="input-field" /></div>
          <div class="form-group"><label>Offer Rate (₹)</label><input type="number" id="setOfferRate" class="input-field" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Min Sell (USDT)</label><input type="number" id="setMinSell" class="input-field" /></div>
          <div class="form-group">
            <label>Enable Offer</label>
            <select id="setIsOfferActive" class="input-field">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>
        </div>
        
        <div class="card-title" style="margin-top: 20px;">Network Addresses</div>
        <div class="form-group"><label>TRC 20</label><input type="text" id="setTrc20" class="input-field" /></div>
        <div class="form-group"><label>BEP 20</label><input type="text" id="setBep20" class="input-field" /></div>
        <div class="form-group"><label>ERC 20</label><input type="text" id="setErc20" class="input-field" /></div>
        
        <button class="btn" style="margin-top: 10px;" onclick="saveSettings()">SAVE SETTINGS</button>
      </div>
    </div>

  </div>

  <script>
    // API Base
    const API_BASE = '/api/';
    let adminToken = localStorage.getItem('bp_admin') || '';
    let adminState = { users: [], banks: [], orders: [], settings: {}, logs: [] };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    // API Request
    async function apiReq(path, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (adminToken) headers['x-token'] = adminToken;
      const res = await fetch(API_BASE + path, { method: 'POST', headers, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.e || 'Error');
      return data;
    }

    // Login
    async function doAdminLogin() {
      const pass = document.getElementById('adminPass').value;
      try {
        const res = await apiReq('admin/login', { p: pass });
        adminToken = res.t;
        localStorage.setItem('bp_admin', adminToken);
        document.getElementById('adminLogin').classList.add('hidden');
        document.getElementById('adminApp').classList.remove('hidden');
        loadAdminData();
      } catch (err) {
        showToast('❌ ' + err.message);
      }
    }

    function logoutAdmin() {
      localStorage.removeItem('bp_admin');
      location.reload();
    }

    // Load Data
    async function loadAdminData() {
      try {
        const data = await apiReq('admin/all', {});
        adminState = data;
        renderOrders();
        renderUsers();
        renderLogs();
        fillSettings();
      } catch (err) {
        showToast('❌ Load failed: ' + err.message);
        if (err.message.includes('login')) logoutAdmin();
      }
    }

    // Tabs Logic
    function switchAdminTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      document.getElementById('tab-' + tabName).classList.remove('hidden');
    }

    // RENDER ORDERS
    function renderOrders() {
      const wrap = document.getElementById('adminOrdersList');
      const query = (document.getElementById('searchOrders').value || '').toLowerCase();
      const filter = document.getElementById('filterStatus').value;

      let filtered = adminState.orders;
      if (filter !== 'all') filtered = filtered.filter(o => o.status === filter);
      if (query) filtered = filtered.filter(o => (o.username || '').toLowerCase().includes(query) || (o.txid || '').toLowerCase().includes(query));

      if (!filtered.length) { wrap.innerHTML = '<p style="color:#6C7A8F; text-align:center;">No orders found.</p>'; return; }

      wrap.innerHTML = filtered.map(o => `
        <div class="list-item">
          <div class="row">
            <div>
              <div style="font-size: 16px; font-weight: bold; color: #fff;">$${o.slot} — ${o.username}</div>
              <div style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">TXN: ${o.txid} | ${new Date(o.ts).toLocaleString()}</div>
            </div>
            <div class="row">
              ${o.status === 'pending' ? `
                <button class="btn-sm btn-approve" onclick="setOrderStatus('${o.id}', 'approved')">Approve</button>
                <button class="btn-sm btn-reject" onclick="setOrderStatus('${o.id}', 'rejected')">Reject</button>
              ` : `<span class="badge b-${o.status}">${o.status.toUpperCase()}</span>`}
              <button class="btn-sm btn-del" onclick="deleteOrder('${o.id}')">🗑️</button>
            </div>
          </div>
          ${o.receipt ? `<div style="margin-top: 10px;"><img src="${o.receipt}" style="max-height: 80px; border-radius: 4px; border: 1px solid var(--border);" /></div>` : ''}
        </div>
      `).join('');
    }

    async function setOrderStatus(id, status) {
      try { await apiReq('admin/order', { id, status }); showToast('✅ Order ' + status); loadAdminData(); } catch (e) { showToast('❌ ' + e.message); }
    }

    async function deleteOrder(id) {
      if (!confirm('Are you sure you want to delete this order?')) return;
      try { await apiReq('admin/order/del', { id }); showToast('✅ Order deleted'); loadAdminData(); } catch (e) { showToast('❌ ' + e.message); }
    }

    // RENDER USERS
    function renderUsers() {
      const wrap = document.getElementById('adminUsersList');
      if (!adminState.users.length) { wrap.innerHTML = '<p style="color:#6C7A8F; text-align:center;">No users found.</p>'; return; }

      wrap.innerHTML = adminState.users.map(u => {
        const userBanks = adminState.banks.filter(b => b.userId === u.id);
        return `
          <div class="list-item" style="margin-bottom: 15px;">
            <div class="row" style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px;">
              <div>
                <div style="font-size: 18px; font-weight: bold; color: var(--neon);">${u.username}</div>
                <div style="font-size: 12px; color: var(--text-dim);">Mobile: ${u.mobile || 'N/A'} | ID: ${u.id}</div>
              </div>
              <div class="row">
                <button class="btn-sm btn-reject" onclick="toggleUser('${u.id}')">${u.disabled ? 'ENABLE' : 'DISABLE'}</button>
                <button class="btn-sm btn-del" onclick="resetPass('${u.id}')">RESET PASS</button>
              </div>
            </div>
            <div>
              <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: bold;">LINKED BANKS:</div>
              ${userBanks.length ? userBanks.map(b => `
                <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 4px; margin-bottom: 5px; font-size: 13px;">
                  <strong>${b.holder || 'No Name'}</strong> - ${b.bank} | A/C: ${b.number} | IFSC: ${b.ifsc}
                </div>
              `).join('') : '<div style="font-size: 12px; color: var(--text-dim);">No bank accounts added.</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    async function createUser() {
      const u = document.getElementById('newUserId').value;
      const p = document.getElementById('newUserPass').value;
      const m = document.getElementById('newUserMob').value;
      try {
        await apiReq('admin/user/add', { u, p, m });
        showToast('✅ User created');
        document.getElementById('newUserId').value = '';
        document.getElementById('newUserPass').value = '';
        document.getElementById('newUserMob').value = '';
        document.getElementById('addUserForm').classList.add('hidden');
        loadAdminData();
      } catch (e) { showToast('❌ ' + e.message); }
    }

    async function toggleUser(id) {
      try { await apiReq('admin/user/toggle', { id }); loadAdminData(); } catch (e) { showToast('❌ ' + e.message); }
    }

    async function resetPass(id) {
      const p = prompt('Enter new password (min 6 chars):');
      if (!p) return;
      try { await apiReq('admin/user/pass', { id, p }); showToast('✅ Password reset'); } catch (e) { showToast('❌ ' + e.message); }
    }

    // RENDER LOGS
    function renderLogs() {
      const wrap = document.getElementById('adminLogsList');
      if (!adminState.logs || !adminState.logs.length) { wrap.innerHTML = '<p style="color:#6C7A8F; text-align:center;">No activity yet.</p>'; return; }
      wrap.innerHTML = adminState.logs.map(l => {
        const user = adminState.users.find(u => u.id === l.userId);
        return `
          <div class="list-item" style="padding: 10px;">
            <div style="font-size: 13px; color: #fff;"><strong>${user ? user.username : 'Unknown'}</strong> <span style="color: var(--neon);">— ${l.action}</span></div>
            <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">${l.details} • ${new Date(l.ts).toLocaleString()}</div>
          </div>
        `;
      }).join('');
    }

    // SETTINGS
    function fillSettings() {
      const s = adminState.settings;
      document.getElementById('setBaseRate').value = s.baseRate || 125;
      document.getElementById('setRateStep').value = s.rateStep || 1;
      document.getElementById('setOfferRate').value = s.offerRate || 126;
      document.getElementById('setMinSell').value = s.minSell || 100;
      document.getElementById('setIsOfferActive').value = s.isOfferActive ? 'true' : 'false';
      document.getElementById('setTrc20').value = s.trc20 || '';
      document.getElementById('setBep20').value = s.bep20 || '';
      document.getElementById('setErc20').value = s.erc20 || '';
    }

    async function saveSettings() {
      const body = {
        baseRate: Number(document.getElementById('setBaseRate').value),
        rateStep: Number(document.getElementById('setRateStep').value),
        offerRate: Number(document.getElementById('setOfferRate').value),
        minSell: Number(document.getElementById('setMinSell').value),
        isOfferActive: document.getElementById('setIsOfferActive').value === 'true',
        trc20: document.getElementById('setTrc20').value,
        bep20: document.getElementById('setBep20').value,
        erc20: document.getElementById('setErc20').value
      };
      try {
        await apiReq('admin/settings', body);
        showToast('✅ Settings Saved');
        loadAdminData();
      } catch (e) { showToast('❌ ' + e.message); }
    }

    // INITIAL BOOT
    window.onload = () => {
      if (adminToken) {
        document.getElementById('adminLogin').classList.add('hidden');
        document.getElementById('adminApp').classList.remove('hidden');
        loadAdminData();
      }
    };
  </script>
</body>
</html>
