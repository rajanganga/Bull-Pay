<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BullPay — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background: #05070A; color: #fff; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0; }
    .hidden { display: none !important; }
    input, select { width: 100%; padding: 12px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; font-family: 'Rajdhani'; font-size: 15px; }
    button { background: #00FF41; color: #000; font-weight: bold; border: none; padding: 15px; border-radius: 8px; font-family: 'Orbitron'; cursor: pointer; width: 100%; }
    .card { background: #0A0E17; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .title { font-family: 'Orbitron'; color: #00FF41; margin-top: 0; margin-bottom: 15px; font-size: 16px; }
    .row { display: flex; gap: 15px; }
    .row > div { flex: 1; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; text-align: center; background: #0A0E17; border: 1px solid #333; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; color: #6C7A8F; }
    .tab.active { background: #00FF41; color: #000; border-color: #00FF41; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="adminLogin" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 400px; border-color: #00FF41;">
      <h1 class="title" style="text-align: center; font-size: 24px;">BULL PAY ADMIN</h1>
      <form id="adminLoginForm">
        <input type="password" name="p" placeholder="Admin Password" required />
        <button type="submit">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="adminApp" class="hidden" style="padding: 20px; max-width: 800px; margin: 0 auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 class="title" style="margin: 0;">ADMIN PANEL</h1>
      <button id="adminLogout" style="width: auto; padding: 8px 15px; background: transparent; border: 1px solid #FF003C; color: #FF003C;">LOGOUT</button>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" data-tab="orders" onclick="switchAdminTab('orders')">Orders</div>
      <div class="tab" data-tab="users" onclick="switchAdminTab('users')">Users</div>
      <div class="tab" data-tab="settings" onclick="switchAdminTab('settings')">Settings</div>
    </div>

    <!-- ORDERS TAB -->
    <div id="tab-orders" class="tab-content">
      <div class="card">
        <h2 class="title">ALL ORDERS</h2>
        <div id="adminOrders"></div>
      </div>
    </div>

    <!-- USERS TAB -->
    <div id="tab-users" class="tab-content hidden">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 class="title" style="margin: 0;">USERS</h2>
          <button onclick="document.getElementById('addUserForm').classList.toggle('hidden')" style="width: auto; padding: 5px 10px; font-size: 12px;">+ ADD USER</button>
        </div>
        
        <div id="addUserForm" class="hidden" style="background: rgba(0,255,65,0.05); padding: 15px; border: 1px dashed #00FF41; margin-bottom: 20px;">
          <form id="newUserForm">
            <input type="text" name="u" placeholder="Username" required />
            <input type="password" name="p" placeholder="Password" required />
            <input type="text" name="m" placeholder="Mobile Number (Optional)" />
            <div class="row">
              <button type="submit">CREATE</button>
              <button type="button" onclick="document.getElementById('addUserForm').classList.add('hidden')" style="background: transparent; border: 1px solid #333; color: #fff;">CANCEL</button>
            </div>
          </form>
        </div>
        <div id="adminUsers"></div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-content hidden">
      <div class="card">
        <h2 class="title">RATE CONFIGURATION</h2>
        <form id="settingsForm">
          
          <div class="row">
            <div>
              <label style="font-size:12px; color:#6C7A8F;">CLEAN FUND (Base)</label>
              <input type="number" name="baseRate" required />
            </div>
            <div>
              <label style="font-size:12px; color:#6C7A8F;">CLEAN STEP</label>
              <input type="number" name="rateStep" required />
            </div>
            <div>
              <label style="font-size:12px; color:#6C7A8F;">OFFER RATE</label>
              <input type="number" name="offerRate" />
            </div>
          </div>

          <div class="row" style="margin-top: 15px;">
            <div>
              <label style="font-size:12px; color:#6C7A8F;">MIX FUND (Base)</label>
              <input type="number" name="mixBase" required />
            </div>
            <div>
              <label style="font-size:12px; color:#6C7A8F;">MIX STEP</label>
              <input type="number" name="mixStep" required />
            </div>
            <div>
              <label style="font-size:12px; color:#6C7A8F;">XXX FUND (Base)</label>
              <input type="number" name="xxxBase" required />
            </div>
            <div>
              <label style="font-size:12px; color:#6C7A8F;">XXX STEP</label>
              <input type="number" name="xxxStep" required />
            </div>
          </div>

          <div class="row" style="margin-top: 15px; margin-bottom: 15px;">
            <div>
              <label style="font-size:12px; color:#6C7A8F;">MIN SELL (USDT)</label>
              <input type="number" name="minSell" required />
            </div>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 20px;">
              <input type="checkbox" name="isOfferActive" id="isOfferActive" style="width: 20px; height: 20px; margin: 0;" />
              <label for="isOfferActive" style="color: #00FF41; font-weight: bold; margin: 0;">ENABLE OFFER</label>
            </div>
          </div>

          <h2 class="title" style="margin-top: 30px;">NETWORK ADDRESSES</h2>
          <label style="font-size:12px; color:#6C7A8F;">TRC 20</label>
          <input type="text" name="trc20" required />
          <label style="font-size:12px; color:#6C7A8F;">BEP 20</label>
          <input type="text" name="bep20" required />
          <label style="font-size:12px; color:#6C7A8F;">ERC 20</label>
          <input type="text" name="erc20" required />

          <button type="submit" style="margin-top: 20px;">SAVE ALL SETTINGS</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    const A = { 
      token: localStorage.getItem('bp_admin') || '', 
      async req(path, body) { 
        const h = { 'Content-Type': 'application/json' }; 
        if (this.token) h['x-token'] = this.token; 
        const r = await fetch('/api/' + path, { method: 'POST', headers: h, body: body ? JSON.stringify(body) : undefined }); 
        const d = await r.json().catch(() => ({})); 
        if (!r.ok) throw new Error(d.e || 'Error'); 
        return d; 
      } 
    };

    let adminState = { users: [], banks: [], orders: [], settings: {}, logs: [] };

    window.switchAdminTab = function(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
    }

    async function loadAll() {
      try {
        const d = await A.req('admin/all', {}); 
        adminState = d;
        renderOrders(); renderUsers(); fillSettings();
        document.getElementById('adminLogin').style.display = 'none';
        document.getElementById('adminApp').classList.remove('hidden');
      } catch (e) { 
        alert('Load failed: ' + e.message);
        localStorage.removeItem('bp_admin'); location.reload();
      }
    }

    function renderOrders() {
      const wrap = document.getElementById('adminOrders');
      if (!adminState.orders.length) { wrap.innerHTML = '<p style="color:#6C7A8F;">No orders yet.</p>'; return; }
      wrap.innerHTML = adminState.orders.map(o => `
        <div style="border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <div><strong>$${o.slot} (${o.fundType || 'Clean'})</strong> - ${o.username}</div>
            <div style="color: ${o.status==='approved'?'#00FF41':o.status==='pending'?'#FFB000':'#FF003C'}; font-weight: bold; text-transform: uppercase;">${o.status}</div>
          </div>
          <div style="font-size: 12px; color: #6C7A8F; margin-bottom: 10px;">TXN: ${o.txid} | Date: ${new Date(o.ts).toLocaleString()}</div>
          ${o.receipt ? `<img src="${o.receipt}" style="max-height: 100px; border-radius: 5px; border: 1px solid #333; margin-bottom: 10px;" />` : ''}
          <div style="display: flex; gap: 10px;">
            ${o.status === 'pending' ? `
              <button onclick="setStatus('${o.id}', 'approved')" style="background:#00FF41; color:#000; padding:5px; flex:1;">APPROVE</button>
              <button onclick="setStatus('${o.id}', 'rejected')" style="background:#FF003C; color:#fff; padding:5px; flex:1;">REJECT</button>
            ` : ''}
            <button onclick="delOrder('${o.id}')" style="background:transparent; border:1px solid #FF003C; color:#FF003C; padding:5px; flex:1;">DELETE</button>
          </div>
        </div>
      `).join('');
    }

    window.setStatus = async (id, status) => {
      await A.req('admin/order', { id, status }); loadAll();
    }
    window.delOrder = async (id) => {
      if(!confirm('Delete this order?')) return;
      await A.req('admin/order/del', { id }); loadAll();
    }

    function renderUsers() {
      const wrap = document.getElementById('adminUsers');
      if (!adminState.users.length) { wrap.innerHTML = '<p style="color:#6C7A8F;">No users yet.</p>'; return; }
      wrap.innerHTML = adminState.users.map(u => `
        <div style="border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
            <div><strong>${u.username}</strong> ${u.disabled ? '<span style="color:#FF003C;">(Disabled)</span>' : ''}</div>
            <div style="color: #6C7A8F; font-size: 12px;">Mob: ${u.mobile || 'N/A'}</div>
          </div>
          <div style="display: flex; gap: 10px;">
            <button onclick="toggleUser('${u.id}')" style="background:#333; color:#fff; padding:5px;">${u.disabled ? 'ENABLE' : 'DISABLE'}</button>
            <button onclick="resetPass('${u.id}')" style="background:#333; color:#fff; padding:5px;">RESET PASS</button>
            <button onclick="delUser('${u.id}')" style="background:#FF003C; color:#fff; padding:5px;">DELETE</button>
          </div>
        </div>
      `).join('');
    }

    window.toggleUser = async (id) => { await A.req('admin/user/toggle', { id }); loadAll(); }
    window.delUser = async (id) => { if(confirm('Delete user?')) { await A.req('admin/user/del', { id }); loadAll(); } }
    window.resetPass = async (id) => {
      const p = prompt('New password (min 6 chars):');
      if(p) { await A.req('admin/user/pass', { id, p }); alert('Password reset'); }
    }

    function fillSettings() {
      const s = adminState.settings;
      const f = document.getElementById('settingsForm');
      f.baseRate.value = s.baseRate || 125; f.rateStep.value = s.rateStep || 1;
      f.mixBase.value = s.mixBase || 135; f.mixStep.value = s.mixStep || 2;
      f.xxxBase.value = s.xxxBase || 150; f.xxxStep.value = s.xxxStep || 3;
      f.offerRate.value = s.offerRate || 126; f.minSell.value = s.minSell || 50;
      f.isOfferActive.checked = s.isOfferActive || false;
      f.trc20.value = s.trc20 || ''; f.bep20.value = s.bep20 || ''; f.erc20.value = s.erc20 || '';
    }

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = e.target;
      await A.req('admin/settings', {
        baseRate: Number(f.baseRate.value), rateStep: Number(f.rateStep.value),
        mixBase: Number(f.mixBase.value), mixStep: Number(f.mixStep.value),
        xxxBase: Number(f.xxxBase.value), xxxStep: Number(f.xxxStep.value),
        offerRate: Number(f.offerRate.value), minSell: Number(f.minSell.value),
        isOfferActive: f.isOfferActive.checked,
        trc20: f.trc20.value, bep20: f.bep20.value, erc20: f.erc20.value
      });
      alert('Settings Saved!'); loadAll();
    });

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { t } = await A.req('admin/login', { p: e.target.p.value });
        A.token = t; localStorage.setItem('bp_admin', t); loadAll();
      } catch (err) { alert(err.message); }
    });

    document.getElementById('newUserForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const f = e.target;
      try { await A.req('admin/user/add', { u: f.u.value, p: f.p.value, m: f.m.value }); loadAll(); f.reset(); } catch (err) { alert(err.message); }
    });

    if(A.token) loadAll();
  </script>
</body>
</html>
